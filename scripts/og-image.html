<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #07080f;
        color: #e8eaf6;
        font-family: "Inter", system-ui, sans-serif;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
      }
      .grid {
        position: absolute; inset: 0; opacity: 0.05;
        background-image:
          linear-gradient(#38bdf8 1px, transparent 1px),
          linear-gradient(90deg, #38bdf8 1px, transparent 1px);
        background-size: 64px 64px;
      }
      .glow-a {
        position: absolute; top: -120px; left: 120px;
        width: 520px; height: 520px; border-radius: 50%;
        background: rgba(56, 189, 248, 0.16); filter: blur(130px);
      }
      .glow-b {
        position: absolute; bottom: -160px; right: 60px;
        width: 420px; height: 420px; border-radius: 50%;
        background: rgba(249, 115, 22, 0.12); filter: blur(120px);
      }
      .content { position: relative; flex: 1; min-width: 0; }
      h1 {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 76px;
        line-height: 0.98;
        letter-spacing: -0.02em;
        margin-bottom: 22px;
      }
      h1 .last {
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .role {
        font-size: 30px;
        font-weight: 500;
        color: #e8eaf6;
        margin-bottom: 12px;
      }
      .stack {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #8892a4;
        margin-bottom: 30px;
      }
      .badge {
        display: inline-block;
        font-size: 21px;
        line-height: 1.35;
        color: #7dd3fc;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.28);
        border-radius: 14px;
        padding: 14px 20px;
      }
      .photo {
        position: relative;
        width: 300px;
        height: 300px;
        flex-shrink: 0;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid rgba(56, 189, 248, 0.35);
      }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>

    <div class="content">
      <h1>Johann<br /><span class="last">Avramov</span></h1>
      <p class="role">Développeur Full-Stack TypeScript / PHP</p>
      <p class="stack">Angular · TypeScript · React · Node.js · Symfony</p>
      <p class="badge">Suisse romande (Genève - Lausanne) · Citoyen UE<br />Disponible sous 1 mois</p>
    </div>

    <div class="photo"><img src="./profile-source.png" alt="" /></div>
  </body>
</html>
